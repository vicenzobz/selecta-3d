  <script>
    // manifesto do app instalável: leva o código de acesso para o ícone abrir já conectado
    (function () {
      var t = new URLSearchParams(location.search).get('t');
      try { if (t) localStorage.setItem('org3d.token', t); else t = localStorage.getItem('org3d.token'); } catch (e) { /* sem armazenamento */ }
      var l = document.createElement('link');
      l.rel = 'manifest';
      l.href = 'manifest.webmanifest' + (t ? '?t=' + encodeURIComponent(t) : '');
      document.head.appendChild(l);
    })();
  </script>
