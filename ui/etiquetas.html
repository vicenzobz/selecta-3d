<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Etiquetas — Selecta 3D</title>
  <style>
    @font-face { font-family: "Barlow Condensed"; font-weight: 900; src: url("vendor/fontes/barlow-condensed-latin-900-normal.woff2") format("woff2"); }
    @font-face { font-family: "Inter"; font-weight: 100 900; src: url("vendor/fontes/inter-latin-wght-normal.woff2") format("woff2"); }
    :root { color-scheme: light; }
    body { margin: 0; background: #eef3f0; color: #0b1f18; font: 400 13px/1.4 "Inter", "Segoe UI", sans-serif; }
    .topo { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; padding: 18px 24px; background: #0e3a2e; color: #e2f3eb; }
    .topo h1 { margin: 0; font: 900 34px/0.9 "Barlow Condensed", sans-serif; text-transform: uppercase; }
    .topo p { margin: 0; flex: 1; min-width: 240px; color: #b7d3c6; }
    .topo button { height: 42px; padding: 0 22px; border: 0; border-radius: 999px; background: #4fdca0; color: #03271c; font-weight: 700; cursor: pointer; }
    .aviso { margin: 16px 24px 0; padding: 12px 16px; border-radius: 12px; background: #fff3d1; color: #6b4b00; }
    .folha { display: grid; grid-template-columns: repeat(auto-fill, 70mm); gap: 4mm; padding: 10mm; }
    .etq { width: 70mm; height: 34mm; box-sizing: border-box; padding: 3mm; background: #fff; border: 0.3mm dashed #9bb3a8;
           border-radius: 2mm; display: grid; grid-template-columns: 26mm 1fr; gap: 3mm; align-items: center; break-inside: avoid; }
    .qr svg, .qr img { width: 26mm; height: 26mm; display: block; }
    .qr .sem { width: 26mm; height: 26mm; display: grid; place-items: center; border: 0.3mm solid #ccd; font-size: 8pt; text-align: center; color: #667; }
    .id { font: 900 26pt/0.85 "Barlow Condensed", sans-serif; }
    .nome { font: 900 13pt/0.95 "Barlow Condensed", sans-serif; text-transform: uppercase; margin-top: 1.2mm; }
    .sub { font-size: 7.5pt; color: #4b5d55; margin-top: 1mm; }
    .cor { display: inline-block; width: 4mm; height: 4mm; border-radius: 50%; vertical-align: -0.6mm; margin-right: 1.2mm; border: 0.2mm solid #0003; }
    @media print {
      @page { size: A4; margin: 8mm; }
      body { background: #fff; }
      .topo, .aviso { display: none; }
      .folha { padding: 0; }
      .etq { border-color: #bbb; }
    }
  </style>
  <script src="vendor/qrcode/qrcode.js"></script>
</head>
<body>
  <div class="topo">
    <h1>Etiquetas</h1>
    <p id="explica">Carregando…</p>
    <button onclick="window.print()">Imprimir</button>
  </div>
  <div id="aviso"></div>
  <div class="folha" id="folha"></div>
  <script src="etiquetas.js"></script>
</body>
</html>
